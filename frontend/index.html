<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程评价系统 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 48px 40px;
      width: 400px;
      max-width: 90vw;
    }
    .login-container h1 {
      text-align: center;
      color: #333;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .login-container .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #555;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e8e8e8;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #667eea;
    }
    .form-group select {
      background: white;
      cursor: pointer;
      appearance: auto;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      color: #e74c3c;
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .demo-accounts {
      margin-top: 29px;
      padding-top: 24px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #888;
    }
    .demo-accounts h4 {
      color: #555;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .demo-accounts .account-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 4px 0;
    }
    .demo-accounts .account-row span {
      color: #666;
    }
    .demo-accounts .account-row .role-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      color: white;
      font-weight: 500;
    }
    .role-admin { background: #e74c3c; }
    .role-teacher { background: #f39c12; }
    .role-student { background: #27ae60; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>课程评价系统</h1>
    <p class="subtitle">Course Evaluation System</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    </form>

    <div class="demo-accounts">
      <h4>示例账号（密码均为 123456，管理员为 admin123）</h4>
      <div class="account-row">
        <span>管理员：admin / admin2</span>
        <span class="role-tag role-admin">管理员</span>
      </div>
      <div class="account-row">
        <span>教师：teacher1 / teacher2 / teacher3</span>
        <span class="role-tag role-teacher">教师</span>
      </div>
      <div class="account-row">
        <span>学生：student1 ~ student5</span>
        <span class="role-tag role-student">学生</span>
      </div>
    </div>
  </div>

  <script>
    const errorMsg = document.getElementById('errorMsg');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorMsg.textContent = '请输入用户名和密码';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';
      errorMsg.textContent = '';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await resp.json();

        if (!resp.ok) {
          errorMsg.textContent = data.error || '登录失败';
          loginBtn.disabled = false;
          loginBtn.textContent = '登 录';
          return;
        }

        // Redirect based on role
        window.location.href = data.redirect;
      } catch (err) {
        errorMsg.textContent = '网络错误，请稍后重试';
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
